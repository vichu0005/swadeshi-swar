<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap" rel="stylesheet">
<title>SWADESHI SWAR – 3D Prototype Simulation</title>
<style>
:root{--bg:#e8edf2;--pn:#f6f8fa;--pn2:#ffffff;--ln:#cfd8e1;--tx:#1c2a36;--tx2:#3c4b59;--mut:#5d6d7c;--ac:#29b6f6;--sel:#e2f1fb;--lw:340px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 'Google Sans','Google Sans Flex',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
body{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) 350px;grid-template-rows:60px minmax(0,1fr);grid-template-areas:"hd hd hd" "lf st rt"}
body.nolf{grid-template-columns:0 minmax(0,1fr) 350px}
body.nolf #lf{display:none}
header{grid-area:hd;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
.ttl{font-weight:800;letter-spacing:.06em;font-size:14px;line-height:1.15}
.ttl small{display:block;color:var(--mut);font-weight:500;letter-spacing:.14em;font-size:10px}
.tabs{display:flex;gap:8px;margin:0 auto}
button{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);border-color:var(--ac);color:#04121b;font-weight:600}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.ic{display:inline-flex}.ic svg{display:block;width:16px;height:16px}
#pt{padding:8px 10px}
aside{background:var(--pn);overflow-x:hidden;overflow-y:auto;padding:18px;min-width:0}
#lf{grid-area:lf;border-right:1px solid var(--ln)}
#rt{grid-area:rt;border-left:1px solid var(--ln)}
aside h2{margin:0 0 12px;padding-bottom:8px;font-size:18px;border-bottom:2px solid var(--ac)}
/* Parts & Specifications section */
.psec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-width:0;text-align:left;white-space:normal;padding:15px 16px;font-size:16px;font-weight:700;line-height:1.3;background:var(--pn2);border:1px solid var(--ln);border-radius:12px;color:var(--tx)}
.psec.open .psec-h{border-color:var(--ac)}
.psec-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.psec.open .psec-b{grid-template-rows:1fr}
.psec-in{min-height:0;min-width:0;overflow:hidden}
.plist{padding-top:12px}
.chev{flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s,margin .2s;margin:-3px 3px 0 0}
.open>.psec-h .chev,.acc.on .chev{transform:rotate(-135deg);margin-top:3px;border-color:var(--ac)}
/* part cards (flat, no shadows) */
.acc{margin:0 0 10px;background:var(--pn2);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:10px;box-shadow:none;min-width:0;overflow:hidden}
.acc.sel{background:var(--sel);border-color:var(--c)}
.acc-h{display:grid;grid-template-columns:24px minmax(0,1fr) 14px;column-gap:12px;align-items:center;width:100%;min-width:0;text-align:left;white-space:normal;padding:13px 14px;background:none;border:0;border-radius:0;box-shadow:none;color:inherit}
.acc-h .tx{min-width:0}
.acc-h b{display:block;font-size:14px;line-height:1.3;overflow-wrap:break-word}
.acc-h i{font-style:normal;font-size:12px;color:color-mix(in srgb,var(--c) 62%,#000);display:block;margin-top:2px;line-height:1.35;overflow-wrap:break-word}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.acc.on .acc-b{grid-template-rows:1fr}
.acc-in{min-height:0;min-width:0;overflow:hidden}
.acc-pad{padding:0 14px 14px 50px;min-width:0}
.acc-pad .br{margin:0;color:var(--tx2);font-size:13px;overflow-wrap:break-word}
.num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#06121a;font-size:12px;font-weight:800;flex:none}
.devp{margin-top:30px}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-bottom:1px solid var(--ln);vertical-align:top;font-size:13px;overflow-wrap:break-word;min-width:0}
td:first-child{color:var(--mut);width:40%;padding-right:10px}
.sec{border-left:3px solid var(--c,var(--ac));padding:2px 0 2px 12px;margin:0 0 18px}
.sec h3{margin:0 0 6px;font-size:15px}
.sec p{margin:0;color:var(--tx2);overflow-wrap:break-word}
.sec ul{list-style:none;margin:0;padding:0}
.sec li{padding:3px 0 3px 22px;position:relative;color:var(--tx2);overflow-wrap:break-word}
.sec li:before{content:"✓";position:absolute;left:0;color:#25a85f;font-weight:700}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--c);color:#06121a;font-weight:700;margin-bottom:6px}
.note{color:var(--mut);font-size:11.5px}
#st{grid-area:st;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#f8fafc 0%,#e9eef3 55%,#dbe3ea 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;pointer-events:none}
#ov svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--c);color:#06121a;font-weight:800;font-size:12px;display:grid;place-items:center;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;box-shadow:0 0 0 3px #ffffffcc,0 2px 8px #0003}
.pin.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.lab{position:absolute;width:210px;min-height:50px;padding:5px 10px;box-sizing:border-box;overflow:hidden;border-radius:8px;background:#fffffff0;border:1px solid var(--ln);border-left:4px solid var(--c);pointer-events:auto;cursor:pointer;font-size:12px;line-height:1.3;display:none;grid-template-columns:22px 1fr;column-gap:9px;align-items:center;text-align:left}
.lab .num{width:22px;height:22px}
.lab .tx{min-width:0}
.lab b{display:block;font-size:13px;overflow-wrap:break-word}
.lab i{display:block;font-style:normal;color:color-mix(in srgb,var(--c) 62%,#000);overflow-wrap:break-word}
.lab.on{background:#e2f1fbf0;border-color:var(--c);box-shadow:0 0 14px -3px var(--c)}
#dev{position:absolute;top:14px;left:14px;z-index:3;padding:10px 20px;font-weight:700;letter-spacing:.02em;background:linear-gradient(135deg,#1e88e5,#29b6f6);border:0;color:#04121b;box-shadow:0 4px 18px -6px #1e88e5}
#dev:hover{filter:brightness(1.08)}
#bar{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#bar .h{font-size:11px;letter-spacing:.18em;color:#6a7d8d;text-align:center;padding:0 10px}
#bar .h.strong{font-size:14px;font-weight:800;letter-spacing:.14em;color:var(--tx)}
#bar .b{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center;padding:0 8px}
#tip{position:fixed;pointer-events:none;background:#000d;color:#fff;padding:3px 8px;border-radius:6px;font-size:12px;display:none;z-index:9}
@media(max-width:900px){
body,body.nolf{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) 32vh;grid-template-areas:"hd" "lf" "st" "rt"}
header{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
.tabs{margin:0;width:100%}.tabs button{flex:1;padding:7px 6px;font-size:13px}
#lf{max-height:28vh;padding:10px;border-right:0;border-bottom:1px solid var(--ln)}
#lf h2{font-size:15px}.devp{margin-top:20px}
.acc-h{padding:10px 12px}.acc-pad{padding:0 12px 12px 48px}
#rt{border-left:0;border-top:1px solid var(--ln)}
#bar button{padding:6px 10px;font-size:12.5px}#bar .h{font-size:10px}#bar .h.strong{font-size:12px}}
</style>
</head>

<div id="tip"></div>

let accOpen=null;

$('pH').onclick=()=>{const ps=$('psec'),o=!ps.classList.contains('open');ps.classList.toggle('open',o);$('pH').setAttribute('aria-expanded',o)};
lf.onclick=e=>{const h=e.target.closest('.acc-h');if(!h)return;const id=h.parentElement.dataset.id;if(accOpen===id){setAcc(null);if(selected===id)select(null)}else{setAcc(id);select(id,true)}};
const pins={},labs={},lines={};
DEF.forEach(d=>{const n=BY[d.id].n;
 const p=document.createElement('div');p.className='pin';p.style.setProperty('--c',d.col);p.textContent=n;p.onclick=()=>select(d.id,true);ov.appendChild(p);pins[d.id]=p;
 const l=document.createElement('div');l.className='lab';l.style.setProperty('--c',d.col);l.innerHTML=`<span class="num">${n}</span><div class="tx"><b>${d.name}</b><i>${d.lsub||d.sub}</i></div>`;l.onclick=()=>select(d.id,true);ov.appendChild(l);labs[d.id]=l;
 const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('stroke',d.col);ln.setAttribute('stroke-width','1.5');ln.setAttribute('stroke-opacity','.8');svg.appendChild(ln);lines[d.id]=ln});

function overview(){rt.innerHTML=`<h2>Advantages</h2>
<div class="sec" style="--c:#29b6f6"><h3>Edge AI Inside</h3><ul><li>Runs AI/ML audio models locally, no cloud needed</li><li>Jetson Orin Nano Super: up to 67 TOPS</li></ul></div>
<div class="sec" style="--c:#b6e04b"><h3>Rugged &amp; Sealed</h3><ul><li>Aluminium body, reinforced corner bumpers</li><li>Sealed connectors and gasketed lid</li></ul></div>
<div class="sec" style="--c:#a259ff"><h3>Actively Cooled</h3><ul><li>Finned heat sink plus fan on the processor</li><li>Vents on top and rear for airflow</li></ul></div>
<div class="sec" style="--c:#ff8a2b"><h3>Modular Stack</h3><ul><li>Each board can be developed and swapped separately</li><li>Simple 12 V DC power input</li></ul></div>
<p class="note">Tap any part, numbered pin or label to see what it does and its technical properties.</p>`}
function detail(id){const d=BY[id];rt.innerHTML=`<div style="--c:${d.col}"><span class="pill">PART ${d.n} OF 6</span></div><h2 style="border-color:${d.col}">${d.name}</h2>
<div class="sec" style="--c:${d.col}"><h3>What it does</h3><p>${d.role}</p></div>
<div class="sec" style="--c:${d.col}"><h3>Key features</h3><ul>${d.feats.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="sec" style="--c:${d.col}"><h3>Technical properties</h3><table>${d.specs.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
<div class="sec" style="--c:${d.col}"><h3>Connected to</h3><p>${d.conn}</p></div>
<button id="back" class="ib" style="width:100%">${icon('back')}<span>Back to overview</span></button>`;$('back').onclick=()=>select(null)}
function select(id,focus){selected=id;if(accOpen!==id)setAcc(null);
 parts.forEach(g=>g.traverse(o=>{if(o.isMesh){o.material.emissive.set(g.userData.id===id?BY[id].col:0x000000);o.material.emissiveIntensity=g.userData.id===id?.4:1}}));
 document.querySelectorAll('.acc').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
 for(const k in pins){pins[k].classList.toggle('on',k===id);labs[k].classList.toggle('on',k===id)}
 if(id){detail(id);rt.scrollTop=0;if(focus){const g=parts.find(p=>p.userData.id===id);tgt.set(0,(g.userData.c0.y+g.userData.off.y*(exploded?1:0)+(exploded?6.5:2.5))/2,0)}}else overview()}
function setExplode(v){exploded=v;zoomTo(cam.position.distanceTo(ctl.target)*(v?1.3:1/1.3));$('bEx').classList.toggle('on',v);paintDev();const hn=$('hint');hn.textContent=v?'TAP A PART OR LABEL FOR DETAILS':'TAP THE DEVICE TO OPEN';hn.classList.toggle('strong',!v);if(!selected)tgt.set(0,v?6.5:2.5,0)}
function setView(v){view=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 const outer=['cover','enclosure'];parts.forEach(g=>{const o=outer.includes(g.userData.id);g.visible=v==='full'||(v==='outer'?o:!o)});
 if(selected&&!parts.find(g=>g.userData.id===selected).visible)select(null)}

$('bRs').onclick=()=>{zoom=null;cam.position.copy(HOME);tgt.set(0,exploded?6.5:2.5,0);select(null)};

const SV=p=>`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg></span>`;

 close:SV('<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>'),

 tfull:SV('<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>'),
 touter:SV('<rect x="3" y="6" width="18" height="12" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/>'),

{const home=HOME.length();cam.position.multiplyScalar(.8);zoomTo(home)}

/* ================= Picking ================= */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),tip=$('tip');let down=null;
const owner=o=>{while(o&&!o.userData.id)o=o.parent;return o};
function pick(e){const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,cam);

let W=1,H=1;const labH={};
function resize(){for(const k in labH)delete labH[k];W=stage.clientWidth;H=stage.clientHeight;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();
 const k=Math.max(1,1.15*(H>0?(W<H?H/W:1):1));HOME.setLength(Math.hypot(27,19,31)*(W<H?1.0+ (H/W-1)*.55:1))}
addEventListener('resize',resize);new ResizeObserver(resize).observe(stage);resize();
const v3=new THREE.Vector3();
function overlay(){const showLabs=exploded&&W>=780;const items=[];
 parts.forEach(g=>{const id=g.userData.id,p=pins[id],l=labs[id],ln=lines[id];
  if(!g.visible){p.style.display=l.style.display='none';ln.style.display='none';return}
  v3.copy(g.userData.c0).add(g.position).project(cam);
  const x=(v3.x+1)/2*W,y=(1-v3.y)/2*H;p.style.display='grid';p.style.left=x+'px';p.style.top=y+'px';items.push({id,x,y})});
 items.sort((a,b)=>a.y-b.y);let prev=-1e9;const lx=W-210-14;
 items.forEach(it=>{const l=labs[it.id],ln=lines[it.id];
  if(!showLabs){l.style.display='none';ln.style.display='none';return}
  let ly=Math.max(it.y-(labH[it.id]||50)/2,prev);ly=Math.max(ly,8);prev=ly+(labH[it.id]||50)+8;
  l.style.display='grid';l.style.left=lx+'px';if(!labH[it.id])labH[it.id]=l.offsetHeight||50;const hh=labH[it.id];l.style.top=ly+'px';
  ln.style.display='';ln.setAttribute('x1',it.x+12);ln.setAttribute('y1',it.y);ln.setAttribute('x2',lx);ln.setAttribute('y2',ly+hh/2)});

 const last=items.length&&labs[items[items.length-1].id];if(showLabs&&last&&parseFloat(last.style.top)>H-130){const sh=parseFloat(last.style.top)-(H-130);items.forEach(it=>{const l=labs[it.id];l.style.top=parseFloat(l.style.top)-sh+'px';lines[it.id].setAttribute('y2',parseFloat(l.style.top)+(labH[it.id]||50)/2)})}}
(function loop(){requestAnimationFrame(loop);
 parts.forEach(g=>{const u=g.userData;u.t+=((exploded?1:0)-u.t)*.07;g.position.copy(u.off).multiplyScalar(u.t)});
 blades.rotation.y+=.35;ctl.target.lerp(tgt,.08);
 if(zoom){const dir=cam.position.clone().sub(ctl.target),d=dir.length();dir.setLength(d+(zoom.to-d)*.06);cam.position.copy(ctl.target).add(dir);if(Math.abs(zoom.to-d)<.05)zoom=null}
