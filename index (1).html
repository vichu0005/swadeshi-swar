<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWADESHI SWAR – 3D Prototype Simulation</title>
<style>
:root{--bg:#070d13;--pn:#0f1821;--pn2:#15212c;--ln:#23323f;--tx:#e8f0f6;--mut:#8fa3b3;--ac:#29b6f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
body{display:grid;grid-template-columns:310px 1fr 350px;grid-template-rows:60px 1fr;grid-template-areas:"hd hd hd" "lf st rt"}
header{grid-area:hd;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
.ttl{font-weight:800;letter-spacing:.06em;font-size:14px;line-height:1.15}
.ttl small{display:block;color:var(--mut);font-weight:500;letter-spacing:.14em;font-size:10px}
.tabs{display:flex;gap:8px;margin:0 auto}
button{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 16px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);border-color:var(--ac);color:#04121b;font-weight:600}
aside{background:var(--pn);overflow:auto;padding:16px}
#lf{grid-area:lf;border-right:1px solid var(--ln)}
#rt{grid-area:rt;border-left:1px solid var(--ln)}
aside h2{margin:0 0 12px;padding-bottom:8px;font-size:18px;border-bottom:2px solid var(--ac)}
.card{display:grid;grid-template-columns:24px 1fr;column-gap:10px;align-items:start;width:100%;text-align:left;margin:0 0 10px;padding:12px;background:var(--pn2);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:10px}
.card.on{background:#12324a;border-color:var(--c)}
.card .tx{min-width:0}
.card b{display:block;font-size:14px;line-height:24px}
.card i{font-style:normal;font-size:12px;color:var(--c);display:block;margin:0 0 4px}
.card .br{color:var(--mut);font-size:12.5px;display:block}
.num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:#06121a;font-size:12px;font-weight:800;flex:none}
table{width:100%;border-collapse:collapse}
td{padding:6px 0;border-bottom:1px solid var(--ln);vertical-align:top;font-size:13px}
td:first-child{color:var(--mut);width:40%;padding-right:10px}
.sec{border-left:3px solid var(--c,var(--ac));padding:2px 0 2px 12px;margin:0 0 18px}
.sec h3{margin:0 0 6px;font-size:15px}
.sec p{margin:0;color:#c6d3de}
.sec ul{list-style:none;margin:0;padding:0}
.sec li{padding:3px 0 3px 22px;position:relative;color:#c6d3de}
.sec li:before{content:"✓";position:absolute;left:0;color:#3ddc84;font-weight:700}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--c);color:#06121a;font-weight:700;margin-bottom:6px}
.note{color:var(--mut);font-size:11.5px}
#st{grid-area:st;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#10283a 0%,#0a1520 45%,#070d13 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;pointer-events:none}
#ov svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--c);color:#06121a;font-weight:800;font-size:12px;display:grid;place-items:center;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;box-shadow:0 0 0 3px #0008,0 0 12px var(--c)}
.pin.on{box-shadow:0 0 0 3px #fff8,0 0 18px var(--c)}
.lab{position:absolute;width:210px;height:50px;padding:0 10px;border-radius:8px;background:#101b25ee;border:1px solid var(--ln);border-left:4px solid var(--c);pointer-events:auto;cursor:pointer;font-size:12px;line-height:1.3;display:none;grid-template-columns:22px 1fr;column-gap:9px;align-items:center;text-align:left}
.lab .num{width:22px;height:22px}
.lab .tx{min-width:0}
.lab b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab i{display:block;font-style:normal;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab.on{background:#12324aee;border-color:var(--c);box-shadow:0 0 16px -2px var(--c)}
#dev{position:absolute;top:14px;left:14px;z-index:3;padding:10px 20px;font-weight:700;letter-spacing:.02em;background:linear-gradient(135deg,#1e88e5,#29b6f6);border:0;color:#04121b;box-shadow:0 4px 18px -4px #29b6f6}
#dev:hover{filter:brightness(1.1)}
#bar{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#bar .h{font-size:11px;letter-spacing:.18em;color:#5f7686}
#bar .b{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center;padding:0 8px}
#tip{position:fixed;pointer-events:none;background:#000d;padding:3px 8px;border-radius:6px;font-size:12px;display:none;z-index:9}
@media(max-width:900px){
body{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) 36vh;grid-template-areas:"hd" "lf" "st" "rt"}
header{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
.tabs{margin:0;width:100%}.tabs button{flex:1;padding:7px 6px;font-size:13px}
#lf{display:flex;gap:8px;padding:8px;border-right:0;border-bottom:1px solid var(--ln)}
#lf h2,#lf .devp{display:none}
.card{min-width:190px;width:190px;margin:0;padding:8px 10px}
.card .br{display:none}.card i{margin:0}
#rt{border-left:0;border-top:1px solid var(--ln)}
#bar button{padding:6px 10px;font-size:12.5px}#bar .h{display:none}}
</style>
</head>

/* ================= UI ================= */
let exploded=true,selected=null,view='full';
const tgt=new THREE.Vector3(0,6.5,0);
let zoom=null;
const zoomTo=d=>{zoom={to:Math.min(Math.max(d,ctl.minDistance),ctl.maxDistance)}};
ctl.addEventListener('start',()=>{zoom=null});
const lf=$('lf'),rt=$('rt'),ov=$('ov'),svg=$('lines');
lf.innerHTML='<h2>Parts &amp; Specifications</h2>'+DEF.map(d=>`<button class="card" data-id="${d.id}" style="--c:${d.col}"><span class="num">${BY[d.id].n}</span><div class="tx"><b>${d.name}</b><i>${d.sub}</i><span class="br">${d.brief}</span></div></button>`).join('')+
'<div class="devp"><h2 style="margin-top:22px">Device Properties</h2><table><tr><td>Name</td><td>SWADESHI SWAR</td></tr><tr><td>Dimensions</td><td>220 × 150 × 60 mm (L × W × H)</td></tr><tr><td>Power input</td><td>12 V DC</td></tr><tr><td>Processor</td><td>NVIDIA Jetson Orin Nano Super</td></tr><tr><td>Cooling</td><td>Heat sink + fan, vented case</td></tr><tr><td>Body</td><td>Rugged aluminium, rubber-style bumpers</td></tr></table><p class="note">Values marked typical are design targets, not measured.</p></div>';
lf.onclick=e=>{const c=e.target.closest('.card');if(c)select(c.dataset.id,true)};
const pins={},labs={},lines={};
DEF.forEach(d=>{const n=BY[d.id].n;
 const p=document.createElement('div');p.className='pin';p.style.setProperty('--c',d.col);p.textContent=n;p.onclick=()=>select(d.id,true);ov.appendChild(p);pins[d.id]=p;
 const l=document.createElement('div');l.className='lab';l.style.setProperty('--c',d.col);l.innerHTML=`<span class="num">${n}</span><div class="tx"><b>${d.name}</b><i>${d.lsub||d.sub}</i></div>`;l.onclick=()=>select(d.id,true);ov.appendChild(l);labs[d.id]=l;
 const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('stroke',d.col);ln.setAttribute('stroke-width','1.5');ln.setAttribute('stroke-opacity','.8');svg.appendChild(ln);lines[d.id]=ln});

function overview(){rt.innerHTML=`<h2>Advantages</h2>
<div class="sec" style="--c:#29b6f6"><h3>🧠 Edge AI Inside</h3><ul><li>Runs AI/ML audio models locally, no cloud needed</li><li>Jetson Orin Nano Super: up to 67 TOPS</li></ul></div>
<div class="sec" style="--c:#b6e04b"><h3>🛡️ Rugged &amp; Sealed</h3><ul><li>Aluminium body, reinforced corner bumpers</li><li>Sealed connectors and gasketed lid</li></ul></div>
<div class="sec" style="--c:#a259ff"><h3>❄️ Actively Cooled</h3><ul><li>Finned heat sink plus fan on the processor</li><li>Vents on top and rear for airflow</li></ul></div>
<div class="sec" style="--c:#ff8a2b"><h3>🧩 Modular Stack</h3><ul><li>Each board can be developed and swapped separately</li><li>Simple 12 V DC power input</li></ul></div>
<p class="note">Tap any part, numbered pin or label to see what it does and its technical properties.</p>`}
function detail(id){const d=BY[id];rt.innerHTML=`<div style="--c:${d.col}"><span class="pill">PART ${d.n} OF 6</span></div><h2 style="border-color:${d.col}">${d.name}</h2>
<div class="sec" style="--c:${d.col}"><h3>What it does</h3><p>${d.role}</p></div>
<div class="sec" style="--c:${d.col}"><h3>Key features</h3><ul>${d.feats.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="sec" style="--c:${d.col}"><h3>Technical properties</h3><table>${d.specs.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>
<div class="sec" style="--c:${d.col}"><h3>Connected to</h3><p>${d.conn}</p></div>
<button id="back" style="width:100%">← Back to overview</button>`;$('back').onclick=()=>select(null)}
function select(id,focus){selected=id;
 parts.forEach(g=>g.traverse(o=>{if(o.isMesh){o.material.emissive.set(g.userData.id===id?BY[id].col:0x000000);o.material.emissiveIntensity=g.userData.id===id?.4:1}}));
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.dataset.id===id));
 for(const k in pins){pins[k].classList.toggle('on',k===id);labs[k].classList.toggle('on',k===id)}
 if(id){detail(id);rt.scrollTop=0;if(focus){const g=parts.find(p=>p.userData.id===id);tgt.set(0,(g.userData.c0.y+g.userData.off.y*(exploded?1:0)+(exploded?6.5:2.5))/2,0)}}else overview()}
function setExplode(v){exploded=v;zoomTo(cam.position.distanceTo(ctl.target)*(v?1.2:1/1.2));$('bEx').classList.toggle('on',v);$('dev').textContent=v?'Close Device':'Open Device';if(!selected)tgt.set(0,v?6.5:2.5,0)}
function setView(v){view=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 const outer=['cover','enclosure'];parts.forEach(g=>{const o=outer.includes(g.userData.id);g.visible=v==='full'||(v==='outer'?o:!o)});
 if(selected&&!parts.find(g=>g.userData.id===selected).visible)select(null)}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)};
$('bEx').onclick=()=>setExplode(!exploded);
$('dev').onclick=()=>setExplode(!exploded);
$('bRot').onclick=e=>{ctl.autoRotate=!ctl.autoRotate;e.currentTarget.classList.toggle('on',ctl.autoRotate)};
$('bRs').onclick=()=>{zoom=null;cam.position.copy(HOME);tgt.set(0,exploded?6.5:2.5,0);select(null)};
$('bFs').onclick=()=>{const d=document;d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen()};
overview();
{const home=HOME.length();cam.position.multiplyScalar(.8);zoomTo(home)}

/* ================= Picking ================= */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),tip=$('tip');let down=null;
const owner=o=>{while(o&&!o.userData.id)o=o.parent;return o};
function pick(e){const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,cam);
 for(const h of ray.intersectObjects(root.children,true)){const g=owner(h.object);if(g&&g.visible)return g.userData.id}return null}
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<6)select(pick(e),true);down=null});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.buttons){tip.style.display='none';return}
 const id=pick(e);canvas.style.cursor=id?'pointer':'grab';
 if(id){tip.textContent=BY[id].n+'. '+BY[id].name;tip.style.cssText+='display:block;left:'+(e.clientX+12)+'px;top:'+(e.clientY+12)+'px'}else tip.style.display='none'});

/* ================= Loop ================= */
let W=1,H=1;
function resize(){W=stage.clientWidth;H=stage.clientHeight;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();
 const k=Math.max(1,1.15*(H>0?(W<H?H/W:1):1));HOME.setLength(Math.hypot(27,19,31)*(W<H?1.0+ (H/W-1)*.55:1))}
addEventListener('resize',resize);new ResizeObserver(resize).observe(stage);resize();
const v3=new THREE.Vector3();
function overlay(){const showLabs=exploded&&W>=780;const items=[];
 parts.forEach(g=>{const id=g.userData.id,p=pins[id],l=labs[id],ln=lines[id];
  if(!g.visible){p.style.display=l.style.display='none';ln.style.display='none';return}
  v3.copy(g.userData.c0).add(g.position).project(cam);
  const x=(v3.x+1)/2*W,y=(1-v3.y)/2*H;p.style.display='grid';p.style.left=x+'px';p.style.top=y+'px';items.push({id,x,y})});
 items.sort((a,b)=>a.y-b.y);let prev=-1e9;const gap=56,lx=W-210-14;
 items.forEach(it=>{const l=labs[it.id],ln=lines[it.id];
  if(!showLabs){l.style.display='none';ln.style.display='none';return}
  let ly=Math.max(it.y-25,prev+gap);ly=Math.max(ly,8);prev=ly;
  l.style.display='grid';l.style.left=lx+'px';l.style.top=ly+'px';
  ln.style.display='';ln.setAttribute('x1',it.x+12);ln.setAttribute('y1',it.y);ln.setAttribute('x2',lx);ln.setAttribute('y2',ly+25)});
 // keep stack inside the viewport if it overflows at the bottom
 const last=items.length&&labs[items[items.length-1].id];if(showLabs&&last&&parseFloat(last.style.top)>H-130){const sh=parseFloat(last.style.top)-(H-130);items.forEach(it=>{const l=labs[it.id];l.style.top=parseFloat(l.style.top)-sh+'px';lines[it.id].setAttribute('y2',parseFloat(l.style.top)+25)})}}
(function loop(){requestAnimationFrame(loop);
 parts.forEach(g=>{const u=g.userData;u.t+=((exploded?1:0)-u.t)*.07;g.position.copy(u.off).multiplyScalar(u.t)});
 blades.rotation.y+=.35;ctl.target.lerp(tgt,.08);
 if(zoom){const dir=cam.position.clone().sub(ctl.target),d=dir.length();dir.setLength(d+(zoom.to-d)*.06);cam.position.copy(ctl.target).add(dir);if(Math.abs(zoom.to-d)<.05)zoom=null}
 ctl.update();renderer.render(scene,cam);overlay()})();
</script>
</body>
</html>
